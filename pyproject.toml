[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-second-brain"
version = "0.1.0"
description = "Local SQLite notes and durable reminders"
requires-python = ">=3.11"

[project.scripts]
second-brain = "second_brain.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
